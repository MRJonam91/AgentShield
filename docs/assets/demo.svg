<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="AgentShield demo: deterministic policy verification for AI agent tool calls with tamper-evident audit logs.">
  <metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description dc:creator="MRJonam91" dc:identifier="ash.p5.9f2b71" dc:rights="(c) 2026 Manoj Rollo (MRJonam91)"/></rdf:RDF></metadata>
  <style>
    .l { font: 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; opacity: 0; animation: in 7s infinite; }
    @keyframes in { 0% { opacity: 0; } 4% { opacity: 1; } 92% { opacity: 1; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .l { animation: none; opacity: 1; } }
  </style>
  <rect width="760" height="330" rx="12" fill="#0d1117"/>
  <rect width="760" height="36" rx="12" fill="#161b22"/>
  <rect y="24" width="760" height="12" fill="#161b22"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f57"/><circle cx="42" cy="18" r="6" fill="#febc2e"/><circle cx="62" cy="18" r="6" fill="#28c840"/>
  <text x="380" y="23" fill="#8b949e" text-anchor="middle" style="font: 13px ui-monospace, monospace">agentshield — ai agent tool security firewall</text>
  
  <text x="24" y="66" fill="#e6edf3" class="l" style="animation-delay:0.3s"><tspan fill="#58a6ff">$ </tspan>agentshield eval --tool read_file --args '{"path":"./workspace/report.md"}'</text>
  <text x="24" y="92" fill="#3fb950" class="l" style="animation-delay:0.8s">✓ ALLOW | Rule: allow-safe-reads | Args sanitized | Audit: #0</text>
  
  <text x="24" y="128" fill="#e6edf3" class="l" style="animation-delay:1.5s"><tspan fill="#58a6ff">$ </tspan>agentshield eval --tool read_file --args '{"path":"../../.env"}'</text>
  <text x="24" y="154" fill="#f85149" class="l" style="animation-delay:2.0s">✗ DENY  | Path traversal blocked: Target path is outside authorized directory roots</text>

  <text x="24" y="190" fill="#e6edf3" class="l" style="animation-delay:2.7s"><tspan fill="#58a6ff">$ </tspan>agentshield eval --tool delete_table --args '{"table":"users"}'</text>
  <text x="24" y="216" fill="#d29922" class="l" style="animation-delay:3.2s">★ ASK   | Human-in-the-Loop confirmation required for destructive tool</text>

  <text x="24" y="252" fill="#e6edf3" class="l" style="animation-delay:3.9s"><tspan fill="#58a6ff">$ </tspan>agentshield audit verify --log ./agentshield-audit.jsonl</text>
  <text x="24" y="278" fill="#3fb950" class="l" style="animation-delay:4.4s">✓ Audit chain VALID: 14 records verified (SHA-256 chain intact, zero tampering)</text>
  <text x="24" y="304" fill="#8b949e" class="l" style="animation-delay:4.9s">♥ Sostieni / Support: github.com/sponsors/MRJonam91 · ko-fi.com/mrjonam</text>
</svg>
